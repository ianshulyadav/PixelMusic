name: Build Phone APK (Release)

on:
  push:
    branches: [ main, master ]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-phone:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode release keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > vz-pixelmusic.jks

      - name: Create keystore.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties

      - name: Create local.properties
        run: |
          echo "TELEGRAM_API_ID=${{ secrets.TELEGRAM_API_ID }}" > local.properties
          echo "TELEGRAM_API_HASH=${{ secrets.TELEGRAM_API_HASH }}" >> local.properties

      - name: Get commit count
        id: commit_count
        run: echo "count=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build all split + universal release APKs
        run: ./gradlew :app:assembleRelease -Ppixelmusic.enableAbiSplits=true -PAPP_VERSION_CODE=${{ steps.commit_count.outputs.count }}

      # ── Read version from gradle.properties (single source of truth) ──────────
      - name: Read version name
        id: version
        run: |
          VERSION_NAME=$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION_NAME"

      # ── Detect if this version is already released on GitHub ─────────────────
      - name: Check if version tag already exists
        id: version_check
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${VERSION_NAME}"
          git fetch --tags origin 2>/dev/null || true
          
          # Also check the target release repository tags using gh api
          EXISTS_REMOTE="false"
          if gh api repos/ianshulyadav/PixelMusicApp/releases/tags/"$TAG" >/dev/null 2>&1; then
            EXISTS_REMOTE="true"
          fi
          
          if [ "$EXISTS_REMOTE" = "true" ] || git tag --list "$TAG" | grep -q "^$TAG$"; then
            COMMIT_MSG=$(git log -1 --pretty=%B)
            if echo "$COMMIT_MSG" | grep -qi "^release:"; then
              echo "is_new_version=true" >> "$GITHUB_OUTPUT"
              echo "Tag $TAG exists, but commit message starts with 'release:' — publishing/updating GitHub Release."
            else
              echo "is_new_version=false" >> "$GITHUB_OUTPUT"
              echo "Tag $TAG already exists on release repository or locally — NOT a new release. Posting as Nightly build."
            fi
          else
            echo "is_new_version=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG does not exist — this IS a new version. GitHub Release will be created."
          fi

      - name: Verify all split APKs
        run: |
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          for apk in \
            app/build/outputs/apk/release/app-arm64-v8a-release.apk \
            app/build/outputs/apk/release/app-armeabi-v7a-release.apk \
            app/build/outputs/apk/release/app-x86_64-release.apk \
            app/build/outputs/apk/release/app-universal-release.apk
          do
            echo "Verifying $apk..."
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt2" dump badging "$apk" > /dev/null
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --verbose "$apk"
          done

      - name: Upload split APK artifacts
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: PixelMusic-phone-release-split-apks
          path: |
            app/build/outputs/apk/release/app-arm64-v8a-release.apk
            app/build/outputs/apk/release/app-armeabi-v7a-release.apk
            app/build/outputs/apk/release/app-x86_64-release.apk
            app/build/outputs/apk/release/app-universal-release.apk
          if-no-files-found: error
          compression-level: 0

      - name: Generate Changelog
        id: changelog
        env:
          PREV_SHA: ${{ github.event.before }}
          CURR_SHA: ${{ github.sha }}
        run: python3 .github/scripts/generate_changelog.py

      # ── GitHub Release — Upload to PUBLIC repo ianshulyadav/PixelMusicApp ───
      - name: Create GitHub Release in Public Repo
        if: >
          success() &&
          steps.version_check.outputs.is_new_version == 'true' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v3
        with:
          repository: ianshulyadav/PixelMusicApp
          token: ${{ secrets.RELEASE_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: v${{ steps.version.outputs.version_name }}
          name: "PixelMusic v${{ steps.version.outputs.version_name }}"
          body: |
            ## What's new in v${{ steps.version.outputs.version_name }}
            ${{ steps.changelog.outputs.changelog_md }}

            ---
            | APK | Architecture / Target |
            |-----|----------------------|
            | `app-arm64-v8a-release.apk` | **Recommended:** Modern phones (Pixel, Samsung, OnePlus, Xiaomi, etc.) |
            | `app-universal-release.apk` | Universal — works on all devices |
            | `app-armeabi-v7a-release.apk` | Older / budget 32-bit ARM phones |
            | `app-x86_64-release.apk` | Emulators & Chromebooks |
          files: |
            app/build/outputs/apk/release/app-arm64-v8a-release.apk
            app/build/outputs/apk/release/app-universal-release.apk
            app/build/outputs/apk/release/app-armeabi-v7a-release.apk
            app/build/outputs/apk/release/app-x86_64-release.apk
          draft: false
          prerelease: false
          make_latest: true

      - name: Install Pyrofork for Telegram upload
        if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: pip install -q pyrofork TgCrypto-pyrofork

      - name: Publish all APKs to Telegram Channel
        if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ steps.version_check.outputs.is_new_version == 'true' && '@PixelMusicApp' || '@indiaflacmusic' }}
          TELEGRAM_THREAD_ID: ${{ steps.version_check.outputs.is_new_version == 'true' && '2457' || '' }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          COMMIT_SHA: ${{ github.sha }}
          IS_RELEASE: ${{ steps.version_check.outputs.is_new_version }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog_html }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_API_ID" ]; then
            echo "Telegram secrets not set, skipping."
            exit 0
          fi
          python3 .github/scripts/publish_telegram.py
